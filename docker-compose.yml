name: docker-zoo-practice
services:
  nginx:
    image: nginx:alpine
    container_name: zoo_nginx
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - zoo_net

  php:
    build: ./php
    container_name: zoo_php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql
    networks:
      - zoo_net

  mysql:
    image: mysql:8.0
    container_name: zoo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - zoo_net

volumes:
  mysql_data:

networks:
  zoo_net:
    driver: bridge
